# 单机全栈（D-03）：一台境内云主机跑 postgres + api + web + caddy。
#
# **Phase 1 明确不引入**四个有状态组件：redis / clickhouse / minio / langfuse。
# 理由（D-05）：Phase 1 的可观测性底座就是 apps/api 的 pino 结构化日志 +
# llm_call 落库表这两样 —— 天然在境内、天然可被 SQL 查。Langfuse 整体推到
# Phase 2（EVAL-01..07 真正需要 dataset / experiment / LLM-as-judge 时），
# 并**明确否决 Langfuse Cloud**：境外，「只传 L0 不传原文」无技术强制手段。
# 在没写一行业务代码之前先背四个有状态组件，是给自己制造第一类运维事故。
#
# 真实值来自 .env（.gitignore 已排除），键与说明见 .env.example。
# 带 `:?` 的变量缺失时 compose 直接失败 —— 比 api 起来之后再报错好。

name: drift

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填（见 .env.example）}
      POSTGRES_DB: ${POSTGRES_DB:-drift}
    volumes:
      # ⚠️ 挂载点是 /var/lib/postgresql，**不是** /var/lib/postgresql/data。
      # PG 18+ 的官方镜像改了数据目录约定：数据放在按主版本号命名的子目录里
      # （docker-library/postgres#1259），这样 pg_upgrade --link 不会跨挂载点边界。
      # 沿用 18 之前到处可见的 .../data 写法会让容器**直接拒绝启动**并报
      # 「there appears to be PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)」—— 本 plan 内实测踩到过。
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 只绑回环：这台机器上的 5432 不对公网开放。self-hosted runner 的集成测试
      # 从本机连它。宿主 5432 被占用时用 POSTGRES_HOST_PORT 换一个。
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-drift}" -d "${POSTGRES_DB:-drift}"']
      # 间隔 >= 10s：T-03-04（healthz 每次都开新连接会打满连接池）的缓解措施之一。
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-drift}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drift}
      PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN 必填（CORS 白名单的唯一来源，不接受 *）}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:?WECOM_WEBHOOK_URL 必填（危机二级的会话外通知）}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:?OPERATOR_API_TOKEN 必填（运营者后台端点的共享密钥，至少 32 字符）}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填（better-auth 签名密钥，至少 32 字符；缺省会让每次重启静默登出全部用户）}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:?CONTACT_ENCRYPTION_KEY 必填（紧急联系人号码的 AES-256-GCM 密钥，64 个十六进制字符；无明文回退）}
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-mock}
      EXPORT_ARTIFACTS_DIR: /var/lib/drift/exports
    volumes:
      # 导出文件（PRIV-04）。命名卷而不是 bind mount —— Plan 11 Task 3 的 7 天
      # TTL 清理作用于它，而一个宿主路径会让「清理范围」取决于部署者怎么挂。
      - export-artifacts:/var/lib/drift/exports
    ports:
      # 绑定地址可配置，默认仅回环。本阶段处理敏感个人信息，监听所有网卡会扩大
      # 暴露面，因此默认值不是 0.0.0.0；本机试玩需要外部访问时用 API_BIND 显式放开。
      - '${API_BIND:-127.0.0.1}:${API_HOST_PORT:-3001}:3001'
    healthcheck:
      # 用 node 的 fetch 而不是 curl：镜像里没有 curl，而为了一个探针装一个
      # HTTP 客户端是给攻击面做加法。
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    ports:
      # 同 api：默认仅回环，WEB_BIND 显式放开（见 .env.example）。
      - '${WEB_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      # 生产必须是已做**非经营性 ICP 备案**的域名（D-04）：境内云厂商对未备案
      # 域名封 80/443，而正常 HTTPS 是 M2 的 Service Worker / Web Push 的前提。
      # 本地开发用 localhost，Caddy 签发内部证书。
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    healthcheck:
      # Caddy 的 admin API（仅回环）。比 `caddy version` 有意义：它证明配置加载成功。
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
  export-artifacts:
  caddy-data:
  caddy-config:
